<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="נקודות משפחתי">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול נקודות משפחתי</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 16px;
            border: 1px solid #cbd5e1;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            font-size: 1rem;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            font-family: inherit;
        }
        .user-select-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }
        .user-btn {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 20px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-align: center;
        }
        .user-btn:hover, .user-btn.active {
            background: var(--primary);
            color: white;
        }
        .flex-row {
            display: flex;
            gap: 8px;
        }
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-container input {
            margin-bottom: 0;
        }
        .toggle-password {
            position: absolute;
            left: 12px;
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1.2rem;
            width: auto;
            margin: 0;
            padding: 0;
        }
        .pin-pill {
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--text);
            display: inline-block;
        }
        .task-row {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⭐ ניהול נקודות משפחתי ⭐</h1>
        
        <div class="card" id="login-card">
            <h3>בחר משתמש לכניסה:</h3>
            <div class="user-select-grid" id="login-user-grid"></div>
            <button class="user-btn" style="width:100%; margin-top:5px;" onclick="selectUser('parent')">הורים 🔒</button>
            <button style="background-color: var(--warning); margin-top: 15px;" onclick="resetAllData()">איפוס כללי (למצב ברירת מחדל)</button>
        </div>

        <div class="card" id="pin-card" style="display: none;">
            <h3 id="pin-title">הזן קוד סודי (PIN):</h3>
            <div class="password-container">
                <input type="password" id="pin-input" placeholder="הקש קוד..." maxlength="6">
                <button type="button" class="toggle-password" onclick="togglePinVisibility()">👁️</button>
            </div>
            <button onclick="verifyPin()" style="margin-top: 15px;">הכנס</button>
            <button style="background-color: var(--text-light);" onclick="backToLogin()">חזרה לתפריט הראשי</button>
        </div>

        <div class="card" id="app-content" style="display: none;">
            <h2 id="welcome-msg" style="font-size: 1.3rem;">ברוך הבא</h2>
            <div id="dynamic-view"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBMEal2r4HVdaDWZ8AaLiRMpzk85fuOHdY",
            authDomain: "family-app-e50f1.firebaseapp.com",
            databaseURL: "https://family-app-e50f1-default-rtdb.firebaseio.com",
            projectId: "family-app-e50f1",
            storageBucket: "family-app-e50f1.appspot.com",
            messagingSenderId: "647839783653",
            appId: "1:647839783653:web:e898a827fec70b5601120c",
            measurementId: "G-EQQMCBWSVG"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = null;
        let appData = null;

        const defaultData = {
            pins: { child1: '1234', child2: '2701', child3: '' },
            children: {
                child1: { name: 'אלון', points: 1, history: [] },
                child2: { name: 'אורי', points: 1, history: [] },
                child3: { name: 'אופיר', points: 0, history: [] }
            },
            tasks: [
                { id: 1, title: 'סידור חדר', points: 3 },
                { id: 2, title: 'הכנת שיעורים', points: 2 },
                { id: 3, title: 'עזרה בהדחת כלים', points: 1 },
                { id: 4, title: 'הימנעות ממסכים בערב', points: 4 },
                { id: 5, title: 'הוצאת קופסת אוכל מהתיק', points: 1 }
            ],
            redemptionRequests: [],
            bonusMessage: { text: '', startTime: '', endTime: '', achievedAlerted: false },
            parentPin: '9999'
        };

        db.ref('familyData').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val) {
                appData = val;
                if (!appData.redemptionRequests) appData.redemptionRequests = [];
                if (!appData.bonusMessage) appData.bonusMessage = { text: '', startTime: '', endTime: '', achievedAlerted: false };
                for (let k in appData.children) {
                    if (!appData.children[k].history) appData.children[k].history = [];
                }
            } else {
                appData = defaultData;
                db.ref('familyData').set(defaultData);
            }
            updateLoginButtons();
            if (currentUser) {
                renderDashboard();
            }
        });

        function saveData() {
            db.ref('familyData').set(appData);
            updateLoginButtons();
            if (currentUser) {
                renderDashboard();
            }
        }

        function updateLoginButtons() {
            const grid = document.getElementById('login-user-grid');
            if (!grid || !appData || !appData.children) return;
            let html = '';
            for (let key in appData.children) {
                let c = appData.children[key];
                html += `<button class="user-btn" id="btn-${key}" onclick="selectUser('${key}')">${c.name}</button>`;
            }
            grid.innerHTML = html;
        }

        function resetAllData() {
            if (confirm('האם לאפס את כל הנתונים, הנקודות, ההיסטוריה והקודים למצב ברירת המחדל?')) {
                appData = defaultData;
                saveData();
                location.reload();
            }
        }

        function selectUser(user) {
            currentUser = user;
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('pin-card').style.display = 'block';
            document.getElementById('pin-title').innerText = user === 'parent' ? 'הזן קוד הורים (9999):' : 'הזן קוד אישי:';
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-input').type = 'password';
        }

        function togglePinVisibility() {
            const input = document.getElementById('pin-input');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function verifyPin() {
            const inputEl = document.getElementById('pin-input');
            if (!inputEl) return;
            const enteredPin = inputEl.value.trim();
            
            if (currentUser === 'parent') {
                if (enteredPin === appData.parentPin) {
                    document.getElementById('pin-card').style.display = 'none';
                    document.getElementById('app-content').style.display = 'block';
                    renderDashboard();
                } else {
                    alert('קוד הורים שגוי.');
                }
                return;
            }

            const correctPin = appData.pins[currentUser] || '';
            if (!correctPin && enteredPin === '') {
                document.getElementById('pin-card').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                renderDashboard();
                return;
            }

            if (enteredPin === correctPin) {
                document.getElementById('pin-card').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                renderDashboard();
            } else {
                alert('קוד שגוי, נסה שוב.');
            }
        }

        function backToLogin() {
            currentUser = null;
            document.getElementById('pin-card').style.display = 'none';
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('login-card').style.display = 'block';
            updateLoginButtons();
        }

        function renderDashboard() {
            if (!appData) return;
            const msg = document.getElementById('welcome-msg');
            const view = document.getElementById('dynamic-view');

            if (currentUser === 'parent') {
                msg.innerHTML = 'ניהול נקודות ומטלות';
                
                let html = '';

                let bonusActive = appData.bonusMessage && appData.bonusMessage.text;
                let achievementUnlocked = false;
                if (bonusActive && appData.bonusMessage.achievedAlerted) {
                    achievementUnlocked = true;
                }

                if (achievementUnlocked) {
                    html += `
                        <div class="card" style="background: #fef08a; border-color: #facc15;">
                            <h3 style="margin-top:0; color:#854d0e;">🎉 הודעת מערכת: הילדים הגיעו ליעד משימת הבונוס המשותפת!</h3>
                            <p style="margin:0; font-size: 0.95rem;">כל הכבוד למשפחה, היעד הושג בהצלחה בתוך מסגרת הזמן.</p>
                        </div>
                    `;
                }

                html += `
                    <div class="card" style="background: #f0fdf4; border-color: #bbf7d0;">
                        <h3 style="margin-top:0; color:#166534;">🏆 סטטוס נקודות הילדים:</h3>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px;">
                `;
                for (let key in appData.children) {
                    let child = appData.children[key];
                    html += `
                        <div style="background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #d1fae5; text-align: center;">
                            <div style="font-weight: bold; color: var(--text);">${child.name}</div>
                            <div style="font-size: 1.4rem; font-weight: bold; color: var(--success); margin: 5px 0;">${child.points}</div>
                            <div style="font-size: 0.8rem; color: var(--text-light);">נקודות</div>
                        </div>
                    `;
                }
                html += `</div></div>`;

                if (appData.redemptionRequests && appData.redemptionRequests.length > 0) {
                    html += `
                        <div class="card" style="background: #fefce8; border-color: #fde047;">
                            <h3 style="margin-top:0; color:#b45309;">🚨 בקשות מימוש ממתינות לאישור:</h3>
                    `;
                    appData.redemptionRequests.forEach((req, idx) => {
                        let childObj = appData.children[req.childKey];
                        let childName = childObj ? childObj.name : 'ילד';
                        html += `
                            <div style="background:#fff; border:1px solid #fde68a; padding:10px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <strong>${childName}</strong> מבקש/ת <strong>${req.amount} נק'</strong> (${req.type}) - ${req.date}
                                </div>
                                <div style="display:flex; gap:5px;">
                                    <button style="width:auto; padding:6px 12px; margin:0; background-color:var(--success);" onclick="approveRedemption(${idx})">אישור</button>
                                    <button style="width:auto; padding:6px 12px; margin:0; background-color:var(--danger);" onclick="rejectRedemption(${idx})">ביטול בקשה</button>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                html += `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="toggleSettingsPanel()">
                            <h3 style="margin:0;">🔑 הגדרות קודים וניהול ילדים</h3>
                            <span id="settings-toggle-icon">▼</span>
                        </div>
                        <div id="settings-panel" style="display:none; margin-top:15px; border-top:1px solid #e2e8f0; padding-top:10px;">
                `;

                for (let key in appData.children) {
                    let child = appData.children[key];
                    let pinVal = appData.pins[key] ? appData.pins[key] : 'טרם הוגדר';
                    html += `
                        <div style="background:#f8fafc; padding:10px; border-radius:8px; margin-bottom:10px; border:1px solid #e2e8f0;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                                <input type="text" value="${child.name}" style="width:120px; margin:0; padding:6px;" onchange="updateChildNameFromParent('${key}', this.value)">
                                <div style="display:flex; gap:5px;">
                                    <button style="width:auto; background-color:var(--warning); padding:6px 10px; margin:0;" onclick="resetChildPoints('${key}')">איפוס נקודות</button>
                                    <button style="width:auto; background-color:var(--danger); padding:6px 10px; margin:0;" onclick="deleteChild('${key}')">מחק</button>
                                </div>
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span>קוד: <span class="pin-pill">${pinVal}</span> (נק': ${child.points})</span>
                                <div>
                                    <input type="text" maxlength="4" placeholder="שנה קוד" style="width:90px; display:inline-block; margin:0 5px; padding:6px;" id="parent-set-pin-${key}">
                                    <button style="width:auto; padding:6px 10px; margin:0;" onclick="parentUpdatePin('${key}')">עדכן</button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                html += `
                            <button style="background-color: var(--success); margin-top: 10px;" onclick="addNewChildModal()">➕ הוסף ילד נוסף</button>

                            <div style="margin-top:15px; border-top:1px solid #e2e8f0; padding-top:10px;">
                                <label style="font-size:0.9rem;">שינוי קוד הורים 🔒:</label>
                                <div style="display:flex; gap:8px;">
                                    <input type="text" maxlength="6" id="parent-new-master-pin" value="${appData.parentPin}" placeholder="קוד הורים חדש">
                                    <button style="width:auto; margin:0;" onclick="parentUpdateMasterPin()">עדכן קוד הורים</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <h3 style="margin-top:0;">📊 מעקב היסטוריות ובקשות לפי ילד:</h3>
                        <label style="font-size:0.9rem; color:var(--text-light);">בחר ילד לצפייה בהיסטוריה:</label>
                        <select id="parent-history-select" onchange="renderParentHistory()">
                `;

                for (let key in appData.children) {
                    let c = appData.children[key];
                    html += `<option value="${key}" ${window.selectedHistChild === key ? 'selected' : ''}>${c.name}</option>`;
                }

                html += `
                        </select>
                        <div id="parent-history-container" style="background:#fff; border:1px solid #cbd5e1; border-radius:8px; padding:10px; max-height:150px; overflow-y:auto; margin-top:8px;">
                        </div>
                    </div>

                    <div class="card" style="background: #fefce8; border-color: #fde047;">
                        <h3 style="margin-top:0;">🌟 משימת בונוס ותזמון:</h3>
                        <textarea id="bonus-msg-text" rows="3" placeholder="למשל: מי שיגיע ל-15 נקודות עד סוף השבוע יקבל בונוס!">${appData.bonusMessage.text || ''}</textarea>
                        
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div>
                                <label style="font-size:0.85rem; color:var(--text-light);">התחלה:</label>
                                <input type="datetime-local" id="bonus-msg-start" value="${appData.bonusMessage.startTime || ''}">
                            </div>
                            <div>
                                <label style="font-size:0.85rem; color:var(--text-light);">סיום (יעד):</label>
                                <input type="datetime-local" id="bonus-msg-end" value="${appData.bonusMessage.endTime || ''}">
                            </div>
                        </div>

                        <div class="flex-row">
                            <button style="background-color: var(--danger); width:auto;" onclick="clearBonusMessage()">מחק משימה</button>
                            <button style="background-color: var(--success);" onclick="saveBonusMessage()">שמור / עדכן משימה</button>
                        </div>
                    </div>

                    <div class="card">
                        <label style="font-size:0.9rem; color:var(--text-light);">בחר ילד להענקת נקודות:</label>
                        <select id="award-child">
                `;

                for (let key in appData.children) {
                    let c = appData.children[key];
                    html += `<option value="${key}">${c.name}</option>`;
                }

                html += `
                        </select>

                        <label style="font-size:0.9rem; color:var(--text-light);">בחר מטלה לביצוע:</label>
                        <select id="award-task">
                `;

                appData.tasks.forEach(t => {
                    html += `<option value="${t.id}">${t.title} (${t.points} נקודות)</option>`;
                });

                html += `
                        </select>
                        <div class="flex-row" style="margin-top:8px;">
                            <button style="background-color: var(--success);" onclick="awardTaskToChild()">הענק נקודות (+)</button>
                            <button style="background-color: var(--danger);" onclick="deductTaskFromChild()">הורד נקודה (-)</button>
                        </div>
                    </div>

                    <div class="card">
                        <h3 style="margin-top:0;">הוספת מטלה חדשה למאגר</h3>
                        <label style="font-size:0.9rem; color:var(--text-light);">שם המטלה:</label>
                        <input type="text" id="parent-new-task-title" placeholder="למשל: פינוי מדיח">
                        <label style="font-size:0.9rem; color:var(--text-light);">ערך נקודות:</label>
                        <input type="number" id="parent-new-task-pts" placeholder="2">
                        <button onclick="addNewTask()">הוסף מטלה למאגר</button>
                    </div>

                    <div class="card">
                        <h3 style="margin-top:0;">מאגר מטלות קיימות (עריכה ומחיקה):</h3>
                `;

                appData.tasks.forEach((t) => {
                    html += `
                        <div class="task-row">
                            <input type="text" id="task-name-${t.id}" value="${t.title}" style="flex:2; margin:0; padding:6px;">
                            <input type="number" id="task-pts-${t.id}" value="${t.points}" style="flex:1; margin:0; padding:6px;">
                            <button style="width:auto; background-color:var(--danger); padding:6px 10px; margin:0;" onclick="deleteTask(${t.id})">מחק</button>
                        </div>
                    `;
                });

                html += `
                        <button style="background-color: var(--success); margin-top: 12px;" onclick="saveAllTasksChanges()">💾 שמור שינויים במאגר המטלות</button>
                    </div>
                    <button style="background-color: var(--danger); margin-top: 15px;" onclick="backToLogin()">התנתק</button>
                `;

                view.innerHTML = html;
                let childKeys = Object.keys(appData.children);
                if (childKeys.length > 0) {
                    if (!window.selectedHistChild || !appData.children[window.selectedHistChild]) {
                        window.selectedHistChild = childKeys[0];
                    }
                }
                renderParentHistory();
            } else {
                let child = appData.children[currentUser];
                if (!child) {
                    backToLogin();
                    return;
                }

                let bonusActive = appData.bonusMessage && appData.bonusMessage.text;
                let isAchieved = false;
                if (bonusActive) {
                    let totalPts = 0;
                    for (let k in appData.children) {
                        totalPts += appData.children[k].points;
                    }
                    if (totalPts >= 10) {
                        isAchieved = true;
                        if (!appData.bonusMessage.achievedAlerted) {
                            appData.bonusMessage.achievedAlerted = true;
                            saveData();
                        }
                    }
                }

                msg.innerText = `האזור האישי של ${child.name}`;
                
                let html = `
                    <p style="font-size: 1.1rem; font-weight: bold;">היתרה שלך: <span style="color:var(--primary);">${child.points}</span> נקודות</p>
                    
                    <div style="background: #eef2ff; border: 1px solid #c7d2fe; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.95rem;">
                        💡 <strong>שימו לב:</strong> נקודה אחת שווה 5 שקלים או 10 דקות מסך!
                    </div>

                    ${bonusActive ? `
                        <div style="background: ${isAchieved ? '#fef08a' : '#fefce8'}; border: 1px solid ${isAchieved ? '#facc15' : '#fde047'}; padding: 14px; border-radius: 8px; margin-bottom: 20px;">
                            ⭐ <strong>משימת בונוס משותפת:</strong> ${appData.bonusMessage.text}<br>
                            <span style="font-size: 0.85rem; color: var(--text-light);">📅 סיום יעד: ${appData.bonusMessage.endTime ? appData.bonusMessage.endTime.replace('T', ' בשעה ') : 'ללא הגבלה'}</span>
                            ${isAchieved ? '<div style="margin-top: 8px; font-weight: bold; color: #854d0e; background: #fff; padding: 6px; border-radius: 6px; text-align: center;">🏆 הישג הושג בהצלחה! כל הכבוד למשפחה!</div>' : '<div style="margin-top: 5px; font-size: 0.85rem; color: var(--warning);">⚡ ממשיכים לעבוד יחד כדי להשלים את היעד!</div>'}
                        </div>
                    ` : ''}

                    <div class="card" style="box-shadow:none; padding:12px; margin-bottom:15px;">
                        <label style="font-size:0.9rem; color:var(--text-light);">כמות נקודות למימוש (מינימום 4):</label>
                        <input type="number" id="redeem-amount" value="4" min="4">
                        
                        <label style="font-size:0.9rem; color:var(--text-light);">צורת מימוש מועדפת:</label>
                        <select id="redeem-type">
                            <option value="כסף (5 ₪ לכל נקודה)">כסף (5 ₪ לכל נקודה)</option>
                            <option value="דקות מסך (10 דקות לכל נקודה)">דקות מסך (10 דקות לכל נקודה)</option>
                        </select>
                        <button onclick="submitRedemption()">הגש בקשת מימוש להורים</button>
                    </div>

                    <div class="card" style="box-shadow:none; padding:12px; margin-bottom:15px;">
                        <label style="font-size:0.9rem; color:var(--text-light);">שינוי קוד אישי (4 ספרות חדשות):</label>
                        <input type="password" id="new-child-pin" maxlength="4" placeholder="הכנס קוד חדש">
                        <button style="background-color: #0ea5e9;" onclick="updateMyPin()">עדכן קוד אישי</button>
                    </div>

                    <h3>ההיסטוריה שלי:</h3>
                    <div style="background:#fff; border:1px solid #cbd5e1; border-radius:8px; padding:10px; max-height:180px; overflow-y:auto; margin-bottom:20px;">
                `;

                if (!child.history || child.history.length === 0) {
                    html += `<p style="color:var(--text-light); font-size:0.9rem; text-align:center;">אין עדיין היסטוריה.</p>`;
                } else {
                    child.history.slice().reverse().forEach(item => {
                        html += `<div style="font-size:0.9rem; border-bottom:1px solid #f1f5f9; padding:8px 0; display:flex; justify-content:space-between;"><span>${item.text}</span><span style="color:var(--success); font-weight:bold;">${item.tag}</span></div>`;
                    });
                }

                html += `</div>
                    <button onclick="backToLogin()">חזרה לדף הראשי</button>
                `;
                view.innerHTML = html;
            }
        }

        function toggleSettingsPanel() {
            const panel = document.getElementById('settings-panel');
            const icon = document.getElementById('settings-toggle-icon');
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
                icon.innerText = '▲';
            } else {
                panel.style.display = 'none';
                icon.innerText = '▼';
            }
        }

        function resetChildPoints(key) {
            if (confirm(`האם לאפס את הנקודות וההיסטוריה עבור ${appData.children[key].name}?`)) {
                appData.children[key].points = 0;
                appData.children[key].history.push({ text: `איפוס נקודות על ידי ההורים (${new Date().toLocaleDateString('he-IL')})`, tag: 'איפוס' });
                saveData();
                alert('הנקודות אופסו בהצלחה!');
            }
        }

        function addNewChildModal() {
            const name = prompt('הכנס את שם הילד החדש:');
            if (!name || !name.trim()) return;
            const newKey = 'child_' + Date.now();
            appData.children[newKey] = { name: name.trim(), points: 0, history: [] };
            appData.pins[newKey] = '';
            saveData();
        }

        function deleteChild(key) {
            if (Object.keys(appData.children).length <= 1) {
                alert('חייב להישאר לפחות ילד אחד במערכת.');
                return;
            }
            if (confirm('האם למחוק ילד זה מהמערכת?')) {
                delete appData.children[key];
                delete appData.pins[key];
                saveData();
            }
        }

        function updateChildNameFromParent(key, newName) {
            if (!newName.trim()) return;
            appData.children[key].name = newName.trim();
            saveData();
        }

        function parentUpdatePin(key) {
            const inputEl = document.getElementById(`parent-set-pin-${key}`);
            if (!inputEl) return;
            const val = inputEl.value.trim();
            if (val.length !== 4) {
                alert('הקוד חייב להיות באורך 4 ספרות.');
                return;
            }
            appData.pins[key] = val;
            saveData();
            alert('הקוד עודכן בהצלחה!');
        }

        function parentUpdateMasterPin() {
            const inputEl = document.getElementById('parent-new-master-pin');
            if (!inputEl) return;
            const val = inputEl.value.trim();
            if (val.length < 2) {
                alert('קוד הורים חייב להכיל לפחות 2 תווים.');
                return;
            }
            appData.parentPin = val;
            saveData();
            alert('קוד ההורים עודכן בהצלחה!');
        }

        function renderParentHistory() {
            const selectEl = document.getElementById('parent-history-select');
            if (!selectEl) return;
            window.selectedHistChild = selectEl.value;
            const container = document.getElementById('parent-history-container');
            const childObj = appData.children[window.selectedHistChild];
            if (!childObj || !childObj.history || childObj.history.length === 0) {
                container.innerHTML = `<p style="color:var(--text-light); font-size:0.9rem; text-align:center; margin:5px 0;">אין היסטוריה לילד זה.</p>`;
                return;
            }

            let hHtml = '';
            childObj.history.slice().reverse().forEach(item => {
                hHtml += `<div style="font-size:0.85rem; border-bottom:1px solid #f1f5f9; padding:6px 0; display:flex; justify-content:space-between;"><span>${item.text}</span><span style="color:var(--success); font-weight:bold;">${item.tag}</span></div>`;
            });
            container.innerHTML = hHtml;
        }

        function saveBonusMessage() {
            const textEl = document.getElementById('bonus-msg-text');
            const startEl = document.getElementById('bonus-msg-start');
            const endEl = document.getElementById('bonus-msg-end');
            if (!textEl) return;
            appData.bonusMessage = {
                text: textEl.value.trim(),
                startTime: startEl ? startEl.value : '',
                endTime: endEl ? endEl.value : '',
                achievedAlerted: false
            };
            saveData();
            alert('משימת הבונוס והתזמון נשמרו בהצלחה בענן!');
        }

        function clearBonusMessage() {
            appData.bonusMessage = { text: '', startTime: '', endTime: '', achievedAlerted: false };
            saveData();
            alert('משימת הבונוס נמחקה.');
        }

        function awardTaskToChild() {
            const childEl = document.getElementById('award-child');
            const taskEl = document.getElementById('award-task');
            if (!childEl || !taskEl) return;
            const childKey = childEl.value;
            const taskId = parseInt(taskEl.value);
            const task = appData.tasks.find(t => t.id === taskId);
            
            if (!task || !appData.children[childKey]) return;

            appData.children[childKey].points += task.points;
            let dateStr = new Date().toLocaleDateString('he-IL');
            appData.children[childKey].history.push({ text: `${task.title} (${dateStr})`, tag: `+${task.points} נק'` });
            saveData();
            alert(`הוענקו ${task.points} נקודות בהצלחה ל-${appData.children[childKey].name}!`);
        }

        function deductTaskFromChild() {
            const childEl = document.getElementById('award-child');
            const taskEl = document.getElementById('award-task');
            if (!childEl || !taskEl) return;
            const childKey = childEl.value;
            const taskId = parseInt(taskEl.value);
            const task = appData.tasks.find(t => t.id === taskId);
            
            if (!task || !appData.children[childKey]) return;

            appData.children[childKey].points -= task.points;
            let dateStr = new Date().toLocaleDateString('he-IL');
            appData.children[childKey].history.push({ text: `הורדת נקודות (${task.title}) (${dateStr})`, tag: `-${task.points} נק'` });
            saveData();
            alert(`הופחתו ${task.points} נקודות מ-${appData.children[childKey].name}!`);
        }

        function addNewTask() {
            const titleEl = document.getElementById('parent-new-task-title');
            const ptsEl = document.getElementById('parent-new-task-pts');
            
            if (!titleEl || !ptsEl) {
                alert('שגיאה באיתור שדות הקלט.');
                return;
            }

            const title = titleEl.value.trim();
            const pts = parseInt(ptsEl.value);

            if (!title || isNaN(pts)) {
                alert('נא למלא את שם המטלה וערך הנקודות.');
                return;
            }

            appData.tasks.push({ id: Date.now(), title: title, points: pts });
            saveData();
            alert('המטלה נוספה למאגר בהצלחה!');
        }

        function saveAllTasksChanges() {
            appData.tasks.forEach(t => {
                const nameEl = document.getElementById(`task-name-${t.id}`);
                const ptsEl = document.getElementById(`task-pts-${t.id}`);
                if (nameEl && ptsEl) {
                    let newTitle = nameEl.value.trim();
                    let newPts = parseInt(ptsEl.value);
                    if (newTitle) t.title = newTitle;
                    if (!isNaN(newPts)) t.points = newPts;
                }
            });
            saveData();
            alert('שינויי המאגר נשמרו בהצלחה!');
        }

        function deleteTask(id) {
            if (confirm('האם למחוק מטלה זו מהמאגר?')) {
                appData.tasks = appData.tasks.filter(t => t.id !== id);
                saveData();
            }
        }

        function updateMyPin() {
            const inputEl = document.getElementById('new-child-pin');
            if (!inputEl) return;
            const newPin = inputEl.value.trim();
            if (newPin.length !== 4) {
                alert('הקוד חייב להיות בדיוק באורך 4 ספרות.');
                return;
            }
            appData.pins[currentUser] = newPin;
            saveData();
            alert('הקוד האישי עודכן בהצלחה!');
            inputEl.value = '';
        }

        function submitRedemption() {
            const amountEl = document.getElementById('redeem-amount');
            const typeEl = document.getElementById('redeem-type');
            if (!amountEl || !typeEl) return;
            const amount = parseInt(amountEl.value);
            const type = typeEl.value;
            let child = appData.children[currentUser];

            if (isNaN(amount) || amount < 4) {
                alert('מינימום נקודות למימוש הוא 4.');
                return;
            }
            if (child.points < amount) {
                alert('אין לך מספיק נקודות למימוש כמות זו.');
                return;
            }

            if (!appData.redemptionRequests) appData.redemptionRequests = [];
            appData.redemptionRequests.push({
                childKey: currentUser,
                amount: amount,
                type: type,
                date: new Date().toLocaleDateString('he-IL')
            });

            saveData();
            alert('בקשת המימוש הוגשה בהצלחה להורים בענן!');
        }

        function approveRedemption(index) {
            let req = appData.redemptionRequests[index];
            let child = appData.children[req.childKey];

            if (!child) {
                appData.redemptionRequests.splice(index, 1);
                saveData();
                return;
            }

            if (child.points < req.amount) {
                alert('לשחקן אין מספיק נקודות כרגע.');
                appData.redemptionRequests.splice(index, 1);
            } else {
                child.points -= req.amount;
                child.history.push({ text: `מימוש אושר: ${req.amount} נקודות עבור ${req.type} (${new Date().toLocaleDateString('he-IL')})`, tag: `-${req.amount} נק'` });
                appData.redemptionRequests.splice(index, 1);
                alert('המימוש אושר והנקודות ירדו מיתרת הילד.');
            }
            saveData();
        }

        function rejectRedemption(index) {
            appData.redemptionRequests.splice(index, 1);
            saveData();
            alert('הבקשה בוטלה.');
        }
    </script>
</body>
</html>

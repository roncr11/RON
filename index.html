<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="נקודות משפחתי">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול נקודות משפחתי</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 16px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            font-size: 1rem;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .user-select-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 10px;
        }
        .user-btn {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 20px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-align: center;
        }
        .user-btn:hover, .user-btn.active {
            background: var(--primary);
            color: white;
        }
        .flex-row {
            display: flex;
            gap: 8px;
        }
        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-container input {
            margin-bottom: 0;
        }
        .toggle-password {
            position: absolute;
            left: 12px;
            background: none;
            border: none;
            color: var(--text-light);
            cursor: pointer;
            font-size: 1.2rem;
            width: auto;
            margin: 0;
            padding: 0;
        }
        .task-item, .history-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⭐ ניהול נקודות משפחתי ⭐</h1>
        
        <div class="card" id="login-card">
            <h3>בחר משתמש לכניסה:</h3>
            <div class="user-select-grid">
                <button class="user-btn" id="btn-child1" onclick="selectUser('child1')">אלון</button>
                <button class="user-btn" id="btn-child2" onclick="selectUser('child2')">אורי</button>
                <button class="user-btn" id="btn-child3" onclick="selectUser('child3')">אופיר</button>
                <button class="user-btn" onclick="selectUser('parent')">הורים 🔒</button>
            </div>
            <button style="background-color: var(--warning); margin-top: 15px;" onclick="resetAllData()">איפוס כללי (למקרה חירום)</button>
        </div>

        <div class="card" id="pin-card" style="display: none;">
            <h3 id="pin-title">הזן קוד סודי (PIN):</h3>
            <div class="password-container">
                <input type="password" id="pin-input" placeholder="הקש קוד..." maxlength="6">
                <button type="button" class="toggle-password" onclick="togglePinVisibility()">👁️</button>
            </div>
            <button onclick="verifyPin()" style="margin-top: 15px;">הכנס</button>
            <button style="background-color: var(--text-light);" onclick="backToLogin()">חזרה לתפריט הראשי</button>
        </div>

        <div class="card" id="app-content" style="display: none;">
            <h2 id="welcome-msg" style="font-size: 1.3rem;">ברוך הבא</h2>
            <div id="dynamic-view"></div>
        </div>
    </div>

    <script>
        let currentUser = null;
        
        let appData = JSON.parse(localStorage.getItem('familyPointsDataV7')) || {
            pins: { child1: '1111', child2: '2222', child3: '3333', parent: '9999' },
            children: {
                child1: { name: 'אלון', points: 50, history: [] },
                child2: { name: 'אורי', points: 40, history: [] },
                child3: { name: 'אופיר', points: 60, history: [] }
            },
            tasks: [
                { id: 1, title: 'סידור חדר', points: 15 },
                { id: 2, title: 'הכנת שיעורי בית', points: 20 },
                { id: 3, title: 'עזרה בשטיפת כלים', points: 10 }
            ],
            rewards: [
                { id: 1, title: 'זמן מסך נוסף (30 דק\')', points: 50 },
                { id: 2, title: 'בחירת ארוחת ערב', points: 100 }
            ]
        };

        if (!appData.pins) appData.pins = { child1: '1111', child2: '2222', child3: '3333', parent: '9999' };
        if (!appData.tasks) appData.tasks = [];
        if (!appData.rewards) appData.rewards = [];
        for (let k in appData.children) {
            if (!appData.children[k].history) appData.children[k].history = [];
        }

        function saveData() {
            localStorage.setItem('familyPointsDataV7', JSON.stringify(appData));
            updateButtonNames();
        }

        function updateButtonNames() {
            if (appData.children.child1) document.getElementById('btn-child1').innerText = appData.children.child1.name;
            if (appData.children.child2) document.getElementById('btn-child2').innerText = appData.children.child2.name;
            if (appData.children.child3) document.getElementById('btn-child3').innerText = appData.children.child3.name;
        }

        window.onload = updateButtonNames;

        function resetAllData() {
            if (confirm('האם לאפס את כל הנתונים והקודים לברירת המחדל?')) {
                localStorage.removeItem('familyPointsDataV7');
                location.reload();
            }
        }

        function selectUser(user) {
            currentUser = user;
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('pin-card').style.display = 'block';
            document.getElementById('pin-title').innerText = user === 'parent' ? 'הזן קוד הורים (9999):' : 'הזן קוד אישי:';
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-input').type = 'password';
        }

        function togglePinVisibility() {
            const input = document.getElementById('pin-input');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        function verifyPin() {
            const enteredPin = document.getElementById('pin-input'].value.trim();
            const correctPin = appData.pins[currentUser];
            
            if (enteredPin === correctPin) {
                document.getElementById('pin-card').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                renderDashboard();
            } else {
                alert('קוד שגוי, נסה שוב.');
            }
        }

        function backToLogin() {
            currentUser = null;
            document.getElementById('pin-card').style.display = 'none';
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('login-card').style.display = 'block';
            updateButtonNames();
        }

        function renderDashboard() {
            const msg = document.getElementById('welcome-msg');
            const view = document.getElementById('dynamic-view');

            if (currentUser === 'parent') {
                msg.innerHTML = 'לוח בקרה הורים 👨‍👩‍👧‍👦';
                
                let html = `<div style="margin-bottom:20px;">
                    <h3>ניהול ילדים, נקודות וקודים:</h3>`;
                
                for (let key in appData.children) {
                    let child = appData.children[key];
                    let childPin = appData.pins[key] || '';
                    html += `
                        <div style="background:#f1f5f9; padding:12px; border-radius:8px; margin-bottom:12px;">
                            <label style="font-size:0.85rem; color:var(--text-light);">שם הילד:</label>
                            <input type="text" value="${child.name}" onchange="updateChildName('${key}', this.value)">
                            
                            <label style="font-size:0.85rem; color:var(--text-light);">קוד אישי לילד (4 ספרות):</label>
                            <input type="text" maxlength="4" value="${childPin}" onchange="updatePin('${key}', this.value)" placeholder="הקש קוד חדש">

                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:5px;">
                                <span>נקודות נוכחיות: <strong>${child.points}</strong></span>
                            </div>
                            <div class="flex-row" style="margin-top:8px;">
                                <button onclick="modifyPoints('${key}', 5)">+5</button>
                                <button onclick="modifyPoints('${key}', 10)">+10</button>
                                <button onclick="modifyPoints('${key}', 20)">+20</button>
                                <button style="background-color:var(--danger);" onclick="modifyPoints('${key}', -10)">-10</button>
                            </div>
                        </div>
                    `;
                }

                html += `</div>
                    <div style="background:#e2e8f0; padding:12px; border-radius:8px; margin-bottom:20px;">
                        <h3>שינוי קוד הורים 🔒:</h3>
                        <input type="text" maxlength="6" value="${appData.pins.parent}" onchange="updatePin('parent', this.value)" placeholder="קוד הורים חדש">
                    </div>

                    <div style="border-top: 2px solid #e2e8f0; padding-top: 15px; margin-bottom:20px;">
                        <h3>הוספת משימה חדשה למערכת:</h3>
                        <input type="text" id="new-task-title" placeholder="שם המשימה">
                        <input type="number" id="new-task-pts" placeholder="כמות נקודות">
                        <button onclick="addNewTask()">הוסף משימה</button>
                    </div>

                    <div style="border-top: 2px solid #e2e8f0; padding-top: 15px; margin-bottom:20px;">
                        <h3>הוספת בונוס מותאם אישית לילד:</h3>
                        <select id="bonus-child-select">
                            <option value="child1">${appData.children.child1.name}</option>
                            <option value="child2">${appData.children.child2.name}</option>
                            <option value="child3">${appData.children.child3.name}</option>
                        </select>
                        <input type="text" id="bonus-reason" placeholder="סיבת הבונוס (למשל: התנהגות מעולה)">
                        <input type="number" id="bonus-pts" placeholder="כמות נקודות בונוס">
                        <button style="background-color: var(--success);" onclick="giveCustomBonus()">הענק בונוס</button>
                    </div>

                    <button style="background-color: var(--danger); margin-top: 15px;" onclick="backToLogin()">התנתק</button>
                `;

                view.innerHTML = html;
            } else {
                let child = appData.children[currentUser];
                msg.innerText = `האזור האישי של ${child.name}`;
                
                let html = `
                    <div style="text-align:center; padding: 20px; background: #e0e7ff; border-radius: 12px; margin-bottom: 20px;">
                        <h3 style="margin:0 0 10px 0;">היתרה שלך:</h3>
                        <p style="font-size: 3rem; font-weight: bold; color: var(--primary); margin: 0;">${child.points}</p>
                    </div>

                    <div style="background: #eef2ff; border: 1px solid #c7d2fe; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.95rem;">
                        💡 <strong>שימו לב:</strong> נקודה אחת שווה 5 שקלים או 10 דקות מסך!
                    </div>

                    <div class="card" style="border: 1px solid #cbd5e1; box-shadow:none; padding:12px; margin-bottom:15px;">
                        <label style="font-size:0.9rem; color:var(--text-light);">כמות נקודות למימוש (מינימום 4):</label>
                        <input type="number" id="redeem-amount" value="4" min="4">
                        
                        <label style="font-size:0.9rem; color:var(--text-light);">צורת מימוש מועדפת:</label>
                        <select id="redeem-type">
                            <option value="כסף (5 ₪ לכל נקודה)">כסף (5 ₪ לכל נקודה)</option>
                            <option value="דקות מסך (10 דקות לכל נקודה)">דקות מסך (10 דקות לכל נקודה)</option>
                        </select>
                        <button onclick="submitRedemption()">הגש בקשת מימוש להורים</button>
                    </div>

                    <h3>משימות זמינות לצבירת נקודות:</h3>
                    <div style="margin-bottom:20px;">
                `;

                if (appData.tasks.length === 0) {
                    html += `<p style="color:var(--text-light);">אין משימות זמינות כרגע.</p>`;
                } else {
                    appData.tasks.forEach((task) => {
                        html += `
                            <div class="task-item">
                                <div>
                                    <strong>${task.title}</strong>
                                    <div style="color:var(--success); font-size:0.9rem;">+${task.points} נקודות</div>
                                </div>
                                <button style="width:auto; padding:8px 12px; margin:0;" onclick="completeTask('${task.title}', ${task.points})">בצעתי!</button>
                            </div>
                        `;
                    });
                }

                html += `</div><h3>היסטוריה שלי:</h3><div style="background:#fff; border:1px solid #cbd5e1; border-radius:8px; padding:10px; max-height:180px; overflow-y:auto; margin-bottom:20px;">`;

                if (!child.history || child.history.length === 0) {
                    html += `<p style="color:var(--text-light); font-size:0.9rem; text-align:center;">אין עדיין היסטוריה.</p>`;
                } else {
                    child.history.slice().reverse().forEach(item => {
                        html += `<div style="font-size:0.9rem; border-bottom:1px solid #f1f5f9; padding:8px 0; display:flex; justify-content:space-between;"><span>${item.text}</span><span style="color:var(--success); font-weight:bold;">${item.tag}</span></div>`;
                    });
                }

                html += `</div>
                    <div class="card" style="border: 1px solid #cbd5e1; box-shadow:none; padding:12px; margin-bottom:15px;">
                        <label style="font-size:0.9rem; color:var(--text-light);">שינוי קוד אישי (4 ספרות חדשות):</label>
                        <input type="password" id="new-child-pin" maxlength="4" placeholder="הכנס קוד חדש">
                        <button style="background-color: #0ea5e9;" onclick="updateMyPin()">עדכן קוד אישי</button>
                    </div>
                    <button onclick="backToLogin()">חזרה לדף הראשי</button>
                `;
                view.innerHTML = html;
            }
        }

        function updateChildName(childKey, newName) {
            appData.children[childKey].name = newName;
            saveData();
        }

        function updatePin(userKey, newPin) {
            if (!newPin || newPin.length < 2) {
                alert('הקוד חייב להכיל לפחות 2 תווים.');
                return;
            }
            appData.pins[userKey] = newPin.trim();
            saveData();
            alert('הקוד עודכן בהצלחה!');
        }

        function updateMyPin() {
            const newPin = document.getElementById('new-child-pin').value.trim();
            if (newPin.length !== 4) {
                alert('הקוד חייב להיות בדיוק באורך 4 ספרות.');
                return;
            }
            appData.pins[currentUser] = newPin;
            saveData();
            alert('הקוד האישי עודכן בהצלחה!');
            document.getElementById('new-child-pin').value = '';
        }

        function modifyPoints(childKey, amount) {
            appData.children[childKey].points += amount;
            let actionText = amount > 0 ? `הורים הוסיפו ${amount} נקודות` : `הורים הפחיתו ${Math.abs(amount)} נקודות`;
            let tag = amount > 0 ? `+${amount} נק'` : `${amount} נק'`;
            appData.children[childKey].history.push({ text: `${actionText} (${new Date().toLocaleDateString('he-IL')})`, tag: tag });
            saveData();
            renderDashboard();
        }

        function giveCustomBonus() {
            const childKey = document.getElementById('bonus-child-select').value;
            const reason = document.getElementById('bonus-reason').value;
            const pts = parseInt(document.getElementById('bonus-pts').value);

            if (!reason || isNaN(pts)) {
                alert('נא למלא את סיבת הבונוס וכמות הנקודות.');
                return;
            }

            appData.children[childKey].points += pts;
            appData.children[childKey].history.push({ text: `בונוס מההורים: ${reason} (${new Date().toLocaleDateString('he-IL')})`, tag: `+${pts} נק'` });
            saveData();
            alert('הבונוס הוענק בהצלחה!');
            renderDashboard();
        }

        function addNewTask() {
            const title = document.getElementById('new-task-title').value;
            const pts = parseInt(document.getElementById('new-task-pts').value);
            if (!title || isNaN(pts)) {
                alert('נא למלא את שם המשימה וכמות הנקודות.');
                return;
            }
            appData.tasks.push({ id: Date.now(), title: title, points: pts });
            saveData();
            alert('המשימה נוספה בהצלחה!');
            renderDashboard();
        }

        function completeTask(taskTitle, pts) {
            appData.children[currentUser].points += pts;
            appData.children[currentUser].history.push({ text: `ביצוע משימה: ${taskTitle} (${new Date().toLocaleDateString('he-IL')})`, tag: `+${pts} נק'` });
            saveData();
            alert(`כל הכבוד! נוספו לך ${pts} נקודות.`);
            renderDashboard();
        }

        function submitRedemption() {
            const amount = parseInt(document.getElementById('redeem-amount').value);
            const type = document.getElementById('redeem-type').value;
            let child = appData.children[currentUser];

            if (isNaN(amount) || amount < 4) {
                alert('מינימום נקודות למימוש הוא 4.');
                return;
            }
            if (child.points < amount) {
                alert('אין לך מספיק נקודות למימוש כמות זו.');
                return;
            }

            child.points -= amount;
            child.history.push({ text: `בקשת מימוש: ${amount} נקודות עבור ${type} (${new Date().toLocaleDateString('he-IL')})`, tag: `-${amount} נק'` });
            saveData();
            alert('בקשת המימוש הוגשה בהצלחה!');
            renderDashboard();
        }
    </script>
</body>
</html>

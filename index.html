<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <!-- אייקון שיופיע על מסך הבית בפלאפון -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

    <!-- הגדרות שרוטמות לאפליקציה להיפתח במסך מלא בלי שורת כתובת של דפדפן -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="נקודות משפחתי">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול נקודות משפחתי</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 24px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 16px;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 1rem;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .user-select-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .user-btn {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-align: center;
        }
        .user-btn:hover, .user-btn.active {
            background: var(--primary);
            color: white;
        }
        .flex-row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⭐ ניהול נקודות משפחתי ⭐</h1>
        
        <div class="card" id="login-card">
            <h3>בחר משתמש לכניסה:</h3>
            <div class="user-select-grid">
                <button class="user-btn" onclick="selectUser('child1')">ילד 1</button>
                <button class="user-btn" onclick="selectUser('child2')">ילד 2</button>
                <button class="user-btn" onclick="selectUser('child3')">ילד 3</button>
                <button class="user-btn" onclick="selectUser('parent')">הורים 🔒</button>
            </div>
        </div>

        <div class="card" id="pin-card" style="display: none;">
            <h3 id="pin-title">הזן קוד סודי (PIN):</h3>
            <input type="password" id="pin-input" placeholder="הקש קוד..." maxlength="4">
            <button onclick="verifyPin()">הכנס</button>
            <button style="background-color: var(--text-light);" onclick="backToLogin()">חזרה</button>
        </div>

        <div class="card" id="app-content" style="display: none;">
            <h2 id="welcome-msg">ברוך הבא</h2>
            <div id="dynamic-view"></div>
            <button style="background-color: var(--danger); margin-top: 20px;" onclick="backToLogin()">התנתק</button>
        </div>
    </div>

    <script>
        let currentUser = null;
        const pins = { child1: '1111', child2: '2222', child3: '3333', parent: '9999' };
        
        // נתונים בסיסיים
        let appData = JSON.parse(localStorage.getItem('familyPointsData')) || {
            children: {
                child1: { name: 'ילד 1', points: 50 },
                child2: { name: 'ילד 2', points: 40 },
                child3: { name: 'ילד 3', points: 60 }
            }
        };

        function saveData() {
            localStorage.setItem('familyPointsData', JSON.stringify(appData));
        }

        function selectUser(user) {
            currentUser = user;
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('pin-card').style.display = 'block';
            document.getElementById('pin-title').innerText = user === 'parent' ? 'הזן קוד הורים:' : 'הזן קוד אישי:';
            document.getElementById('pin-input').value = '';
        }

        function verifyPin() {
            const enteredPin = document.getElementById('pin-input').value;
            if (enteredPin === pins[currentUser]) {
                document.getElementById('pin-card').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                renderDashboard();
            } else {
                alert('קוד שגוי, נסה שוב.');
            }
        }

        function backToLogin() {
            currentUser = null;
            document.getElementById('pin-card').style.display = 'none';
            document.getElementById('app-content').style.display = 'none';
            document.getElementById('login-card').style.display = 'block';
        }

        function renderDashboard() {
            const msg = document.getElementById('welcome-msg');
            const view = document.getElementById('dynamic-view');

            if (currentUser === 'parent') {
                msg.innerText = 'לוח בקרה הורים 👨‍👩‍👧‍👦';
                let html = `<h3>ניהול נקודות לילדים:</h3>`;
                for (let key in appData.children) {
                    let child = appData.children[key];
                    html += `
                        <div style="background:#f1f5f9; padding:10px; border-radius:8px; margin-bottom:10px;">
                            <strong>${child.name}</strong> - נקודות: <span id="pts-${key}">${child.points}</span>
                            <div class="flex-row" style="margin-top:8px;">
                                <button onclick="modifyPoints('${key}', 10)">+ 10</button>
                                <button style="background-color:var(--danger);" onclick="modifyPoints('${key}', -10)">- 10</button>
                            </div>
                        </div>
                    `;
                }
                view.innerHTML = html;
            } else {
                let child = appData.children[currentUser];
                msg.innerText = `שלום, ${child.name} 👋`;
                view.innerHTML = `
                    <div style="text-align:center; padding: 20px; background: #e0e7ff; border-radius: 12px;">
                        <h3>יתרת הנקודות שלך:</h3>
                        <p style="font-size: 2.5rem; font-weight: bold; color: var(--primary); margin: 0;">${child.points}</p>
                    </div>
                `;
            }
        }

        function modifyPoints(childKey, amount) {
            appData.children[childKey].points += amount;
            saveData();
            renderDashboard();
        }
    </script>
</body>
</html>
